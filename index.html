<style>
  /* css/base.css */

* { box-sizing: border-box; }

body { 
  font-family: 'Libre Franklin', sans-serif; 
}
.template {
  display: none;
}

/* Typography */
h1 {
  font-family: 'Arvo', serif;
  font-weight: 700;
  font-size: 36px;
}
h3 {
  font-family: 'Arvo', serif;
  font-weight: 400;
  font-size: 16px;
  margin-bottom: 1em;
}

/* 1. Define the "Theme" Variables */
:root {
  --bg-page: oklch(100% 0 0);
  --text-page: oklch(20% 0.02 270);
  --hue: 140; /* Wordle green */
}

/* 2. Prettier OKLCH Heatmap Scale */
/* Light Mode Defaults */
.intensity-0  { background-color: oklch(96% 0.02 var(--hue)); color: black; }
.intensity-1  { background-color: oklch(90% 0.05 var(--hue)); color: black; }
.intensity-2  { background-color: oklch(84% 0.08 var(--hue)); color: black; }
.intensity-3  { background-color: oklch(78% 0.11 var(--hue)); color: black; }
.intensity-4  { background-color: oklch(72% 0.14 var(--hue)); color: black; }
.intensity-5  { background-color: oklch(66% 0.17 var(--hue)); color: white; }
.intensity-6  { background-color: oklch(60% 0.20 var(--hue)); color: white; }
.intensity-7  { background-color: oklch(54% 0.23 var(--hue)); color: white; }
.intensity-8  { background-color: oklch(48% 0.26 var(--hue)); color: white; }
.intensity-9  { background-color: oklch(40% 0.28 var(--hue)); color: white; }
.intensity-10 { background-color: oklch(32% 0.30 var(--hue)); color: white; }

/* 3. Dark Mode Overrides (We flip the Lightness so "Hot" is bright) */
.dark .intensity-0  { background-color: oklch(25% 0.04 var(--hue) / .6); color: oklch(70% 0.04 var(--hue) / .2); }
.dark .intensity-1  { background-color: oklch(30% 0.07 var(--hue)); color: white; }
.dark .intensity-2  { background-color: oklch(35% 0.10 var(--hue)); color: white; }
.dark .intensity-3  { background-color: oklch(40% 0.13 var(--hue)); color: white; }
.dark .intensity-4  { background-color: oklch(45% 0.16 var(--hue)); color: white; }
.dark .intensity-5  { background-color: oklch(50% 0.19 var(--hue)); color: white; }
.dark .intensity-6  { background-color: oklch(55% 0.22 var(--hue)); color: black; }
.dark .intensity-7  { background-color: oklch(65% 0.25 var(--hue)); color: black; }
.dark .intensity-8  { background-color: oklch(75% 0.27 var(--hue)); color: black; }
.dark .intensity-9  { background-color: oklch(85% 0.29 var(--hue)); color: black; }
.dark .intensity-10 { background-color: oklch(95% 0.31 var(--hue)); color: black; }

nav {
  border-bottom: 1px solid oklch(0.37 0.06 265.16);
  margin-bottom: 2em;
}
.nav-tab {
  margin-left: 1em;
  padding-top: 4px;
  padding-bottom: 4px;
  padding-left: 1em;
  padding-right: 1em;
  border-top-right-radius: .5em;
  border-top-left-radius: .5em;
}
.nav-tab-active {
  color: white;
  font-weight: 500;
  background-color: oklch(0.37 0.06 265.16);

}
  /* css/heatmap.css */
:root {
  --heatmap-grid-size: 30px;
}

.isometric-container {
  perspective: 1000px;
  padding-top: 100px;
  display: flex;
  justify-content: center;
  align-items: center; 
  transform: translate(0, -20%);

  min-width: 795px;
  overflow-y: scroll;
}

.heatmap-grid {
  display: grid;
  transform: rotateX(60deg) rotateZ(45deg);
  transform-style: preserve-3d; 
  gap: 2px;
}

/* Individual Cell */
.cell {
  width: var(--heatmap-grid-size);
  height: var(--heatmap-grid-size);
  background: oklch(90% 0.05 var(--hue));
  transition: transform 0.2s, background 0.3s;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Libre Franklin', sans-serif;
  font-size: 10px;
  cursor: pointer;
  border-radius: 3px;
  user-select: none;
}

/* Make the cells "Pop" up on hover */
.cell:hover {
  transform: translateZ(10px);
  box-shadow: -5px 5px 15px rgba(0,0,0,0.3);
  z-index: 10;
}

.cell-header {
  background-color:  oklch(0% 0.05 var(--hue));
}


.cell {
  position: relative;
  transform-style: preserve-3d;
}



.cell::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  height: 100%;
  background: inherit;
  filter: brightness(0.8);
  transform: rotateY(-90deg) translateX(50%);
  transform-origin: left;
} 

  /* css/freqchart.css */
.two-letter-frequency-chart .bar-label,
.frequency-chart .bar-label {
    font-weight: 700;
    font-family: 'Arvo', serif;
    text-transform: uppercase;
    opacity: .5;
    padding: .25em;
}
.two-letter-frequency-chart .bar-value,
.frequency-chart .bar-value {
    opacity: .5;
}
/* 

.bar-row .bar {

}  */

  /* css/wordpicker.css */
.picker .score {
    opacity: .5;
}

.picker .word {
    text-transform: uppercase;
    opacity: .8;
    font-family: 'Arvo', serif;
    font-weight: 500;

}
</style>

<script>

function getTemplate(targetSelector) {
    const targetElement = document.querySelector(targetSelector);

    return targetElement.children[0].cloneNode(true);
}
function onScroll() {
    showHeatmapTooltip(false);
}
function onTabActive(targetSelector) {
    const targetElement = document.querySelector(targetSelector);
    showHeatmapTooltip(false);
    const letterFrequencies = window.data.letter_frequencies;
    const twoLetterFrequencies = window.data.two_letter_frequencies;
    
    switch (targetSelector) {
        case ".all":
            makeFrequencyChart(letterFrequencies, ".all .frequency-chart", /[a-z]/);
            makeFrequencyChart(twoLetterFrequencies, ".all .two-letter-frequency-chart", /[a-z]/);
            
            makeHeatmap(".all .heatmap-chart", /[a-z]/)
            break;
        case ".consonants":
            makeFrequencyChart(letterFrequencies, ".consonants .frequency-chart", /[^aeiou]/);
            makeFrequencyChart(twoLetterFrequencies, ".consonants .two-letter-frequency-chart", /[^aeiou]{2}/);
            
            makeHeatmap(".consonants .heatmap-chart", /[^aeiou]/)
          
            break;
        case ".vowels":
            makeFrequencyChart(letterFrequencies, ".vowels .frequency-chart", /[aeiou]/);
            makeFrequencyChart(twoLetterFrequencies, ".vowels .two-letter-frequency-chart", /[aeiou]{2}/);
            
            makeHeatmap(".vowels .heatmap-chart", /[aeiou]/);
            break;
        case ".picker":
            makeWordPickerTable(".picker-grid");
            break;
    }

}

function loadTabs() {
    const tabs = document.querySelectorAll('.nav-tab');
    const contents = document.querySelectorAll('.nav-tab-content');

    tabs.forEach(tab => {
        tab.addEventListener('click', (e) => {
            e.preventDefault(); // Stop the page from jumping because of href="#"

            const targetSelector = tab.getAttribute('data-target');
            const targetElement = document.querySelector(targetSelector);

            onTabActive(targetSelector)

            // 1. Reset all content to hidden
            contents.forEach(c => {
                c.classList.add('hidden');
                c.classList.remove('block');
            });

            // 2. Reset all tab styles to inactive
            tabs.forEach(t => {
                t.classList.remove('nav-tab-active');
            });

            // 3. Activate the clicked tab and its content
            targetElement.classList.remove('hidden');
            targetElement.classList.add('block');

            tab.classList.add('nav-tab-active');
        });
    });
    onTabActive(".all")
}

function makeFrequencyChart(letterFrequencies, targetSelector, filterRegex) {

    const targetElement = document.querySelector(targetSelector);

    const filteredFrequencies = letterFrequencies.filter((freq) => filterRegex.test(freq.letter || freq.letter_combo)).splice(0, 10);
    // get the max frequency to normalize the bars
    const maxFreq = letterFrequencies[0].total_pct;


    let html = "";
    const allBarText = filteredFrequencies.map((letterFrequency) => {

        const freqChart = getTemplate(".template-bar-row");
        const letter = letterFrequency.letter || letterFrequency.letter_combo;

        freqChart.querySelector(".bar-container .bar").style = "width: " + (letterFrequency.total_pct / maxFreq * 100) + "%";
        freqChart.querySelector(".bar-container .bar").classList.add("intensity-" + letterFrequency.intensity ?? "0");
        freqChart.querySelector(".bar-container .bar").dataset.letter_frequency = JSON.stringify(letterFrequency);

        freqChart.querySelector(".bar-row .bar-label").innerText = letter;
        freqChart.querySelector(".bar-row .bar-value").innerText = letterFrequency.total_cnt + " (" + letterFrequency.total_pct.toFixed(1) + "%) ";
        html += freqChart.outerHTML;
    })



    targetElement.innerHTML = html;


}

function showHeatmapTooltip(show) {
    const tooltip = document.querySelector(".heatmap-tooltip");
      
    if (show) {
        tooltip.classList.remove('hidden');
    }
    else {
        tooltip.classList.add('hidden');   
    }

}
function onHeatmapGridClicked(e) {
    const cell = e.target;
    const letterCombo = cell?.dataset?.letter_combo;

    if (!letterCombo) {
        showHeatmapTooltip(false);
        return;
    }
    

    const letterData = window.data.two_letter_frequencies.find(freq => freq.letter_combo == letterCombo)
    if (!letterData) {
        showHeatmapTooltip(false);
        return;
    }
        
    const rect = cell.getBoundingClientRect();


    const tooltipContent = document.querySelector(".heatmap-tooltip-content");
    tooltipContent.innerHTML = `
        <strong class="block text-indigo-400 text-sm uppercase">${letterData.letter_combo}</strong>
        <span class="opacity-70">Frequency:</span> ${letterData.total_pct.toFixed(1)}% (${letterData.total_cnt})<br/>
        <span class="opacity-70">Start of word:</span> ${letterData.pct_start.toFixed(1)}% (${letterData.start_count})<br/>
        <span class="opacity-70">Middle of word:</span> ${letterData.pct_middle.toFixed(1)}% (${letterData.middle_count})<br/>
        <span class="opacity-70">End of word:</span> ${letterData.pct_end.toFixed(1)}% (${letterData.end_count})<br/>
    `;
    const tooltip = document.querySelector(".heatmap-tooltip");
    tooltip.style.left = `${rect.left + rect.width / 2}px`;
    tooltip.style.top = `${rect.top}px`;

    showHeatmapTooltip(true);

    
  

}
function makeHeatmap(targetSelector, regexFilter) {
    const alphabet = 'abcdefghijklmnopqrstuvwxyz'.split('').filter(letter => regexFilter.test(letter));
    const isometricContainer = getTemplate(".template-heatmap");

    const grid = isometricContainer.querySelector(".heatmap-grid");
    
    grid.className = `heatmap-grid grid grid-cols-${alphabet.length +1} grid-rows-${alphabet.length +1}`
    grid.style = `grid-template-columns: repeat(${alphabet.length +1}, 30);
                  grid-template-rows: repeat(${alphabet.length +1}, 30);`

    
    grid.onmousedown = onHeatmapGridClicked;

    // Create a lookup map for your two_letter_frequencies data
    const freqMap = {};
    window.data.two_letter_frequencies.forEach(f => {
        freqMap[f.letter_combo] = f.total_cnt; // Or use your intensity logic here
    });

    ['',...alphabet].forEach(header => {
        const cell = document.createElement('div');
        cell.innerText = header;
        cell.className = 'cell cell-header';
        grid.appendChild(cell);
    })
    alphabet.forEach(first => {
        {
            // create the header for the row.
            const cell = document.createElement('div');
            cell.innerText = first;
            cell.className = 'cell cell-header';
            grid.appendChild(cell);
        }
        alphabet.forEach(second => {
            const combo = first + second;
            const count = freqMap[combo] || 0;

            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.innerText = combo;

            // Apply your intensity logic (0-10)
            const MAX_FREQ = 189; // REVIEW get the data to do this 
            const intensity = Math.round((count / MAX_FREQ) * 10);

            
            cell.classList.add(`intensity-${intensity}`);

            // Tooltip or label
            cell.title = `${combo}: ${count}`;
            cell.dataset.letter_combo = combo;


            grid.appendChild(cell);
        });
    });
    document.querySelector(targetSelector).replaceChildren(isometricContainer);
}

        return `
